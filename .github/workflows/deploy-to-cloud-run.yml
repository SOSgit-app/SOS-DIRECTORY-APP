name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: directory-app-474617
  SERVICE_NAME: roster-app
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy to Cloud Run
      run: |
        set -uxo pipefail
        set +e
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --source . \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 1Gi \
          --cpu 1 \
          --max-instances 10 \
          --min-instances 1 \
          --set-env-vars "GOOGLE_CLOUD_PROJECT=directory-app-474617" \
          --verbosity=debug
        deploy_exit=$?
        set -e
        if [ "$deploy_exit" -ne 0 ]; then
          echo "Cloud Run deploy failed (exit $deploy_exit). Fetching recent Cloud Build logs..."

          start_time="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          image_name="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}"
          echo "Looking for recent Cloud Builds since: $start_time"
          echo "Filtering for image: $image_name"

          latest_build_id="$(gcloud builds list \
            --project "${{ env.PROJECT_ID }}" \
            --filter="createTime>=$start_time AND images:$image_name" \
            --sort-by=~createTime \
            --limit=1 \
            --format='value(id)' || true)"
          if [ -n "$latest_build_id" ]; then
            echo "Latest Cloud Build ID: $latest_build_id"
            gcloud builds describe "$latest_build_id" --project "${{ env.PROJECT_ID }}" || true

            log_url="$(gcloud builds describe "$latest_build_id" --project "${{ env.PROJECT_ID }}" --format='value(logUrl)' || true)"
            if [ -n "$log_url" ]; then
              echo "Cloud Build log URL: $log_url"
            fi

            gcloud builds log "$latest_build_id" --project "${{ env.PROJECT_ID }}" || true
          else
            echo "Could not determine latest Cloud Build ID."
            gcloud builds list \
              --project "${{ env.PROJECT_ID }}" \
              --filter="createTime>=$start_time" \
              --sort-by=~createTime \
              --limit=10 || true
          fi

          exit "$deploy_exit"
        fi
    
    - name: Route traffic to latest revision
      run: |
        gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }}

    - name: Get Service URL
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
        echo "Service deployed to: $SERVICE_URL"
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

    - name: Test Deployment
      run: |
        echo "Testing deployment..."
        curl -f $SERVICE_URL || exit 1
        echo "Testing search for STAFFORD, JACOB R..."
        SEARCH_RESULT=$(curl -s "$SERVICE_URL/search?query=JACOB")
        if echo "$SEARCH_RESULT" | grep -q "STAFFORD"; then
          echo "✅ Deployment test successful! JACOB found in roster."
        else
          echo "❌ WARNING: JACOB not found in search results!"
          echo "Search result: $SEARCH_RESULT"
          exit 1
        fi
